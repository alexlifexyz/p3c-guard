name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    name: validate and test (Claude Code ${{ matrix.claude-code }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum version the README documents, and the newest release.
        claude-code: ['2.1.287', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude-code }}
      - run: claude --version
      - run: claude plugin validate .
      - run: claude plugin test .
